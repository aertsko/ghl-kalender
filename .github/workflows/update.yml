name: Kalender bijwerken
on:
  schedule:
    - cron: "17 */2 * * *"   # elke 2 uur
  workflow_dispatch:          # manueel starten via tabblad Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_data.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Kalender bijgewerkt" && git push
